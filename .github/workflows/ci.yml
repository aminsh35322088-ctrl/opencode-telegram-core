name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: runtime
        run: bun run typecheck

      - name: Test runtime
        working-directory: runtime
        run: bun test

      - name: Test unbound session probe boundary
        run: python3 -m unittest tests.worker.test_node_agent.UnboundTests.test_session_probe_creates_addresses_deletes_and_verifies_without_durable_authority tests.worker.test_node_agent.UnboundTests.test_session_probe_cleanup_failure_fails_closed_without_persisting_session tests.worker.test_node_agent.UnboundTests.test_session_probe_rejects_payload_session_bound_and_not_ready_authority -v

      - name: Test toolchain and release contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  upstream-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install native grammar build tool
        run: npm install --global node-gyp@11
      - name: Verify patched live runtime
        env:
          GOMAXPROCS: '4'
          GOMEMLIMIT: 3GiB
        run: bash scripts/test-upstream-runtime.sh

  telegram-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - name: Install native grammar build tool
        run: npm install --global node-gyp@11
      - name: Build and verify production graph
        run: bash scripts/build-runtime.sh
      - name: Build independent compatibility CLI
        run: bash scripts/build-compat-cli.sh
      - name: Verify actual production composition and compiled execution
        env:
          GOMAXPROCS: '4'
          GOMEMLIMIT: 3GiB
        run: bash scripts/test-headless-runtime.sh
      - name: Verify Bot SDK surface
        run: bash scripts/build-sdk.sh
